<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pharmacy | City Clinic</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <h2>🏥 DCMS</h2>
    <a href="dashboard.html">Dashboard</a>
    <a href="doctor.html">Doctor Panel</a>
     <a href="triage.html">Triage</a>
      <a href="queue.html">Live Queue</a>
    <a href="pharmacy.html" class="active">Pharmacy</a>
    <a href="records.html">Medical Records</a>
    <a href="reports.html">Reports</a>
    <a href="admin.html">Admin Panel</a>
     <button class="logout" onclick="logout()">Logout</button>
  </aside>

  <main class="main">
    <div class="header">
      <h1>Pharmacy Inventory</h1>
      <div class="who"><span id="pharmName">...</span></div>
    </div>

    <div class="stats">
      <div class="stat">
        <div class="num" id="statTotal">0</div>
        <div class="lbl">Medication Types</div>
      </div>
      <div class="stat">
        <div class="num" id="statLow">0</div>
        <div class="lbl">Low Stock Alerts</div>
      </div>
    </div>

    <div class="panel">
      <h3>➕ Add New Medication</h3>
      <div class="field"><label>Name</label><input id="mName"></div>
      <div class="field"><label>Form (Tablet/Capsule/Syrup...)</label><input id="mForm"></div>
      <div class="field"><label>Batch Number</label><input id="mBatch"></div>
      <div class="field"><label>Expiry Date</label><input type="date" id="mExpiry"></div>
      <div class="field"><label>Quantity</label><input type="number" id="mQty" value="100"></div>
      <div class="field"><label>Minimum Threshold</label><input type="number" id="mThreshold" value="10"></div>
      <button class="btn" onclick="addMedication()">Add</button>
      <div id="addMsg" class="msg"></div>
    </div>

    <div class="panel">
      <h3>💊 Current Inventory</h3>
      <table>
        <thead>
          <tr><th>Name</th><th>Form</th><th>Batch</th><th>Expiry</th><th>Stock</th><th>Status</th><th>Update</th></tr>
        </thead>
        <tbody id="medTable">
          <tr><td colspan="7" style="text-align:center;color:#a0aec0">Loading...</td></tr>
        </tbody>
      </table>
    </div>
  </main>
</div>

<script src="js/api.js"></script>
<script>
const user = getUser();
if (!user) window.location.href = 'index.html';
document.getElementById('pharmName').textContent = user.name;

async function loadMeds() {
  const tbody = document.getElementById('medTable');
  try {
    const meds = await apiFetch('/inventory');
    document.getElementById('statTotal').textContent = meds.length;
    const low = meds.filter(m => m.quantity_on_hand <= m.minimum_threshold);
    document.getElementById('statLow').textContent = low.length;

    tbody.innerHTML = meds.map(m => {
      const isLow = m.quantity_on_hand <= m.minimum_threshold;
      const isExpiring = new Date(m.expiry_date) - new Date() < 90 * 24 * 3600 * 1000;
      return `
        <tr>
          <td>${m.name}</td>
          <td>${m.form || '-'}</td>
          <td>${m.batch_number || '-'}</td>
          <td>${m.expiry_date ? new Date(m.expiry_date).toLocaleDateString() : '-'}</td>
          <td>${m.quantity_on_hand}</td>
          <td>
            ${isLow ? '<span class="badge red">LOW</span>' : '<span class="badge green">OK</span>'}
            ${isExpiring ? '<span class="badge orange">EXPIRING</span>' : ''}
          </td>
         <td>
  <div style="display:flex;gap:0.3rem;align-items:center;flex-wrap:wrap">
    <input type="number" id="qty_${m.medication_id}" value="10" min="1" style="width:55px;padding:0.25rem;font-size:0.8rem">
    <button class="btn success" style="width:auto;padding:0.3rem 0.6rem;font-size:0.72rem"
            onclick="addStock(${m.medication_id})" title="Add received stock">+ Receive</button>
    <button class="btn danger" style="width:auto;padding:0.3rem 0.6rem;font-size:0.72rem"
            onclick="dispenseStock(${m.medication_id})" title="Dispense to patient">− Dispense</button>
  </div>
</td>
      
        </tr>`;
    }).join('');
  } catch (err) {
    tbody.innerHTML = `<tr><td colspan="7" style="color:#e53e3e">${err.message}</td></tr>`;
  }
}

// ADD — pharmacist receives a delivery
async function addStock(medId) {
  const input = document.getElementById(`qty_${medId}`);
  const qty = parseInt(input.value);
  if (!qty || qty <= 0) return alert('Enter a positive number');

  try {
    await apiFetch(`/inventory/${medId}/stock`, {
      method: 'PATCH',
      body: JSON.stringify({ quantity: qty })
    });
    loadMeds();
  } catch (err) {
    alert('Failed: ' + err.message);
  }
}

// DISPENSE — pharmacist gives medication to a patient
async function dispenseStock(medId) {
  const input = document.getElementById(`qty_${medId}`);
  const qty = parseInt(input.value);
  if (!qty || qty <= 0) return alert('Enter a positive number to dispense');

  const meds = await apiFetch('/inventory');
  const med = meds.find(m => m.medication_id === medId);
  if (!med) return alert('Medication not found');

  if (med.quantity_on_hand < qty) {
    return alert(` Not enough stock!\nOnly ${med.quantity_on_hand} available.`);
  }

  if (!confirm(`Dispense ${qty} × ${med.name} to patient?\n\nCurrent stock: ${med.quantity_on_hand}\nNew stock: ${med.quantity_on_hand - qty}`)) {
    return;
  }

  try {
    await apiFetch(`/inventory/${medId}/stock`, {
      method: 'PATCH',
      body: JSON.stringify({ quantity: -qty })  // negative number subtracts
    });
    loadMeds();
  } catch (err) {
    alert('Failed: ' + err.message);
  }
}


async function addMedication() {
  const msg = document.getElementById('addMsg');
  msg.className = 'msg';
  const body = {
    name: document.getElementById('mName').value,
    form: document.getElementById('mForm').value,
    batch_number: document.getElementById('mBatch').value,
    expiry_date: document.getElementById('mExpiry').value,
    quantity_on_hand: parseInt(document.getElementById('mQty').value),
    minimum_threshold: parseInt(document.getElementById('mThreshold').value)
  };
  if (!body.name) { msg.textContent = 'Name required'; msg.className = 'msg error'; return; }
  try {
    await apiFetch('/inventory', {
      method: 'POST',
      body: JSON.stringify(body)
    });
    msg.textContent = ' Medication added';
    msg.className = 'msg success';
    ['mName','mForm','mBatch','mExpiry'].forEach(id => document.getElementById(id).value = '');
    loadMeds();
  } catch (err) {
    msg.textContent = err.message;
    msg.className = 'msg error';
  }
}

loadMeds();
</script>
<script src="js/tour.js"></script>
</body>
</html>
