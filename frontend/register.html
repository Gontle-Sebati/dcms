<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Patient Registration | City Clinic</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="login-wrapper">
  <div class="card">
    <h1>Patient Registration</h1>
    <p class="sub">Create your City Clinic account</p>
    <div id="msg" class="msg"></div>
    <form id="regForm">
      <div class="field"><label>First Name</label><input id="first_name" required></div>
      <div class="field"><label>Last Name</label><input id="last_name" required></div>
      <div class="field"><label>Email</label><input type="email" id="email" required></div>
      <div class="field"><label>Password (min 4 chars)</label><input type="password" id="password" minlength="4" required></div>
      <div class="field"><label>Phone (optional)</label><input id="phone" placeholder="+27 ..."></div>
      <div class="field"><label>ID Number (optional)</label><input id="id_number"></div>
      <div class="field"><label>Date of Birth</label><input type="date" id="date_of_birth"></div>
      <div class="field">
        <label>Gender</label>
        <select id="gender">
          <option value="">Select</option>
          <option>Male</option>
          <option>Female</option>
          <option>Other</option>
        </select>
      </div>
      <button type="submit" class="btn">Create Account</button>
    </form>
    <div class="link">Already have an account? <a href="index.html">Login here</a></div>
  </div>
</div>
<script src="js/api.js"></script>
<script>
document.getElementById('regForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const msg = document.getElementById('msg');
  msg.className = 'msg';

  const body = {
    first_name: document.getElementById('first_name').value,
    last_name: document.getElementById('last_name').value,
    email: document.getElementById('email').value,
    password: document.getElementById('password').value,
    phone: document.getElementById('phone').value,
    id_number: document.getElementById('id_number').value,
    date_of_birth: document.getElementById('date_of_birth').value,
    gender: document.getElementById('gender').value
  };

  try {
    await apiFetch('/auth/register/patient', {
      method: 'POST',
      body: JSON.stringify(body)
    });
    msg.textContent = 'Registration successful! Redirecting to login...';
    msg.className = 'msg success';
    setTimeout(() => window.location.href = 'index.html', 1500);
  } catch (err) {
    msg.textContent = err.message;
    msg.className = 'msg error';
  }
});
</script>
</body>
</html>
